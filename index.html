<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Nuestro Diario | Mes 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --rosa-mexicano: #E4007C;
            --rosa-claro: #FFB3D9;
            --rosa-fondo: #FFF0F6;
            --texto-oscuro: #2D2D2D;
            --texto-claro: #666666;
            --blanco: #FFFFFF;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
        }

        body {
            background-color: var(--rosa-fondo);
            font-family: 'Lexend', sans-serif;
            color: var(--texto-oscuro);
            overflow-x: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* --- BARRA DE NAVEGACIÓN --- */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); 
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: calc(15px + env(safe-area-inset-top)) 15px 15px;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .nav-pill {
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            color: var(--texto-claro);
            transition: all 0.3s ease;
            white-space: nowrap; 
        }

        .nav-pill.active {
            background-color: var(--rosa-mexicano);
            color: var(--blanco);
            box-shadow: 0 4px 10px rgba(228, 0, 124, 0.3);
        }

        .nav-pill.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* --- INTRODUCCIÓN A PANTALLA COMPLETA --- */
        .hero {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: calc(80px + env(safe-area-inset-top)) 20px 40px;
            position: relative;
        }

        .hero-content {
            max-width: 800px;
            animation: fadeUpIn 1.5s ease-out;
            width: 100%;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 900;
            color: var(--rosa-mexicano);
            margin-bottom: 20px;
            letter-spacing: -1.5px;
            line-height: 1.1;
        }

        .hero .subtitle {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--texto-oscuro);
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .hero-letter {
            font-size: 1.1rem;
            line-height: 1.8;
            color: var(--texto-claro);
            background: var(--blanco);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            position: relative;
            border: 1px solid rgba(228, 0, 124, 0.1);
        }

        .hero-letter::before {
            content: '“';
            position: absolute;
            top: -10px;
            left: 20px;
            font-size: 5rem;
            color: var(--rosa-claro);
            font-family: serif;
            opacity: 0.5;
        }

        .hero-letter span {
            color: var(--rosa-mexicano);
            font-weight: 600;
        }

        .scroll-indicator {
            position: absolute;
            bottom: max(30px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            color: var(--rosa-mexicano);
            font-size: 2rem;
            opacity: 0.7;
        }

        @keyframes fadeUpIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0) translateX(-50%); }
            40% { transform: translateY(-15px) translateX(-50%); }
            60% { transform: translateY(-7px) translateX(-50%); }
        }

        /* --- TIMELINE INTERACTIVO --- */
        .timeline {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 20px 100px;
            position: relative;
        }

        .timeline::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 4px;
            background: var(--rosa-claro);
            transform: translateX(-50%);
            border-radius: 4px;
        }

        .dia-card {
            position: relative;
            width: 100%;
            margin-bottom: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .dia-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .dia-card:nth-child(even) { flex-direction: row-reverse; }

        .dia-info {
            width: 45%;
            background: var(--blanco);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            border: 1px solid rgba(228, 0, 124, 0.08);
            position: relative;
        }

        .dia-info::before {
            content: '';
            position: absolute;
            top: 50%;
            width: 20px;
            height: 20px;
            background: var(--rosa-mexicano);
            border: 4px solid var(--rosa-fondo);
            border-radius: 50%;
            transform: translateY(-50%);
        }

        .dia-card:nth-child(odd) .dia-info::before { right: -36px; }
        .dia-card:nth-child(even) .dia-info::before { left: -36px; }

        .fecha-badge {
            display: inline-block;
            background: var(--rosa-fondo);
            color: var(--rosa-mexicano);
            font-weight: 600;
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 15px;
        }

        .dia-info h2 { font-size: 1.5rem; margin-bottom: 12px; color: var(--texto-oscuro); }
        .dia-info p { font-size: 0.95rem; line-height: 1.7; color: var(--texto-claro); }

        .media-container {
            width: 45%;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
            background-color: var(--blanco); 
        }

        .media-container img, .media-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 24px;
            transition: transform 0.5s ease;
        }

        .media-container:hover img { transform: scale(1.03); }

        /* --- RESPONSIVE OPTIMIZADO PARA TABLETS Y PANTALLAS MEDIANAS --- */
        @media screen and (max-width: 768px) {
            .navbar {
                flex-wrap: wrap; 
                gap: 10px;
                padding: calc(10px + env(safe-area-inset-top)) 10px 10px;
            }
            .nav-pill { padding: 6px 14px; font-size: 0.8rem; }
            
            .hero-letter { padding: 25px; font-size: 1rem; }
            .hero-letter::before { left: 10px; font-size: 4rem; top: -5px; }
            
            .timeline { padding: 40px 15px 80px; }
            .timeline::before { left: 25px; transform: none; }
            
            .dia-card, .dia-card:nth-child(even) { 
                flex-direction: column; 
                align-items: flex-end; 
                margin-bottom: 40px;
            }
            
            .dia-info, .media-container { width: calc(100% - 45px); }
            .dia-info { margin-bottom: 15px; padding: 20px; }
            
            .dia-card:nth-child(odd) .dia-info::before, 
            .dia-card:nth-child(even) .dia-info::before { 
                left: -32px; 
                right: auto;
            }
        }

        /* --- OPTIMIZACIÓN ESTRICTA PARA CELULARES PEQUEÑOS --- */
        @media screen and (max-width: 480px) {
            .hero h1 { font-size: 2.8rem; }
            .hero-letter { padding: 20px 15px; font-size: 0.95rem; line-height: 1.6; }
            .dia-info { padding: 18px 15px; }
            .dia-info h2 { font-size: 1.3rem; }
            .dia-info p { font-size: 0.9rem; }
